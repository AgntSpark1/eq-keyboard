# 用 XcodeGen 生成 Xcode 工程：brew install xcodegen && xcodegen generate
name: EQKeyboard
options:
  bundleIdPrefix: com.yonghuizhang.eqkeyboard
  deploymentTarget:
    iOS: "17.0"
packages:
  PinyinKit:
    path: PinyinKit
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: 2U62224FHB
    # App 的 Bundle ID；键盘是 <Bundle ID>.keyboard，两者通过钥匙串共享组 <TeamID>.<Bundle ID>.shared 共享数据
    EQ_BUNDLE_ID: com.yonghuizhang.eqkeyboard
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    # 后端地址，App 与键盘共用
    EQ_API_BASE_URL: "http://localhost:8787"
targets:
  EQKeyboard:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(EQ_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
    sources:
      - App
      - Shared
      - Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: EQ Keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        EQKeychainGroup: $(AppIdentifierPrefix)$(EQ_BUNDLE_ID).shared
        EQAPIBaseURL: $(EQ_API_BASE_URL)
        NSPhotoLibraryUsageDescription: Import chat screenshots. Text is recognized on your phone and the image is never uploaded.
    entitlements:
      path: App/EQKeyboard.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)$(EQ_BUNDLE_ID).shared]
        com.apple.developer.applesignin: [Default]
    dependencies:
      - target: EQKeyboardExtension
  EQKeyboardExtension:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(EQ_BUNDLE_ID).keyboard
        TARGETED_DEVICE_FAMILY: "1"
    sources:
      - KeyboardExtension
      - Shared
      - Resources
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: EQ Keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EQAPIBaseURL: $(EQ_API_BASE_URL)
        EQKeychainGroup: $(AppIdentifierPrefix)$(EQ_BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            # 联网和读剪贴板需要用户开启“允许完全访问”
            RequestsOpenAccess: true
    dependencies:
      - package: PinyinKit
    entitlements:
      path: KeyboardExtension/EQKeyboardExtension.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)$(EQ_BUNDLE_ID).shared]
