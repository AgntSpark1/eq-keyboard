# 用 XcodeGen 生成 Xcode 工程：brew install xcodegen && xcodegen generate
name: EQKeyboard
options:
  bundleIdPrefix: com.example.eqkeyboard
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""  # 填入你的 Apple 开发者 Team ID
    # 后端地址，App 与键盘共用
    EQ_API_BASE_URL: "http://localhost:8787"
targets:
  EQKeyboard:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: EQ Keyboard
        UILaunchScreen: {}
        EQAPIBaseURL: $(EQ_API_BASE_URL)
        NSPhotoLibraryUsageDescription: Import chat screenshots. Text is recognized on your phone and the image is never uploaded.
    entitlements:
      path: App/EQKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.eqkeyboard]
    dependencies:
      - target: EQKeyboardExtension
  EQKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - KeyboardExtension
      - Shared
      - Resources
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: EQ Keyboard
        EQAPIBaseURL: $(EQ_API_BASE_URL)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            # 联网和读剪贴板需要用户开启“允许完全访问”
            RequestsOpenAccess: true
    entitlements:
      path: KeyboardExtension/EQKeyboardExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.eqkeyboard]
