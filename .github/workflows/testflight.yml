name: TestFlight

# 在云端签名、打包并上传到 TestFlight，手机上用 TestFlight App 安装。
# Team ID 和 Bundle ID 写在 ios/project.yml 里。需要在 GitHub 仓库 Settings > Secrets and variables > Actions 里配置：
#   密钥 Secrets：ASC_KEY_ID、ASC_ISSUER_ID、ASC_PRIVATE_KEY（App Store Connect API 密钥 .p8 文件的全部内容）
#   变量 Variables（可选）：EQ_API_BASE_URL 后端地址
# 没配密钥时跳过，不会报错。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios/**"]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    env:
      HAS_KEY: ${{ secrets.ASC_KEY_ID != '' }}
      BUILD_SETTINGS: >-
        CURRENT_PROJECT_VERSION=${{ github.run_number }}
        CODE_SIGN_STYLE=Automatic
        ${{ vars.EQ_API_BASE_URL && format('EQ_API_BASE_URL={0}', vars.EQ_API_BASE_URL) || '' }}
    steps:
      - name: Skip without App Store Connect key
        if: env.HAS_KEY != 'true'
        working-directory: .
        run: echo "::notice::ASC_KEY_ID 等密钥还没配置，跳过 TestFlight 上传"
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - run: brew install xcodegen
        if: env.HAS_KEY == 'true'
      - run: xcodegen generate
        if: env.HAS_KEY == 'true'
      - name: Write App Store Connect API key
        if: env.HAS_KEY == 'true'
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc/key.p8"
      - name: Archive
        if: env.HAS_KEY == 'true'
        run: |
          # -allowProvisioningUpdates 让 Xcode 用 API 密钥自动注册 App ID、App Group 并生成证书和描述文件
          xcodebuild archive \
            -project EQKeyboard.xcodeproj \
            -scheme EQKeyboard \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EQKeyboard.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            $BUILD_SETTINGS
      - name: Check app record in App Store Connect
        if: env.HAS_KEY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # 上传前确认 API 密钥能看到这个 Bundle ID 对应的 App，失败时打印苹果的原始回复
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import json, os, time, urllib.error, urllib.request
          import jwt
          key = open(os.path.join(os.environ["RUNNER_TEMP"], "asc", "key.p8")).read()
          now = int(time.time())
          token = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"]},
          )
          url = "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.yonghuizhang.eqkeyboard&fields[apps]=name,bundleId"
          request = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
          try:
              body = json.load(urllib.request.urlopen(request))
          except urllib.error.HTTPError as err:
              print(f"::error::App Store Connect API {err.code}: {err.read().decode()[:1000]}")
              raise SystemExit(1)
          # 苹果的 bundleId 过滤是前缀匹配，键盘扩展的 ID 也会被查出来，所以这里要精确比较
          apps = [(a["attributes"]["name"], a["attributes"]["bundleId"]) for a in body["data"]]
          print("Apps found:", apps)
          if not any(bundle == "com.yonghuizhang.eqkeyboard" for _, bundle in apps):
              print("::error::App Store Connect 里没有套装 ID 正好是 com.yonghuizhang.eqkeyboard 的 App（不能用以 .keyboard 结尾的键盘扩展 ID）")
              raise SystemExit(1)
          PY
      - name: Upload to TestFlight
        if: env.HAS_KEY == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>2U62224FHB</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/EQKeyboard.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
      - name: Show export errors
        if: failure()
        working-directory: .
        run: |
          # xcodebuild 只打印一句概括，详细原因在分发日志里
          find "$TMPDIR" -name 'IDEDistribution*.log' 2>/dev/null | while read -r log; do
            echo "== $log"
            grep -iE 'error|status|reason|forbidden|not found' "$log" | grep -viE 'authorization|bearer' | tail -40
          done
      - name: Remove API key
        if: always()
        working-directory: .
        run: rm -rf "$RUNNER_TEMP/asc"
