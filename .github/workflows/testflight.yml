name: TestFlight

# 在云端签名、打包并上传到 TestFlight，手机上用 TestFlight App 安装。
# 需要在 GitHub 仓库 Settings > Secrets and variables > Actions 里配置：
#   变量 Variables：APPLE_TEAM_ID、EQ_BUNDLE_ID、EQ_API_BASE_URL
#   密钥 Secrets：ASC_KEY_ID、ASC_ISSUER_ID、ASC_PRIVATE_KEY（App Store Connect API 密钥 .p8 文件的全部内容）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios/**"]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    if: vars.APPLE_TEAM_ID != '' && vars.EQ_BUNDLE_ID != ''
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    env:
      BUILD_SETTINGS: >-
        DEVELOPMENT_TEAM=${{ vars.APPLE_TEAM_ID }}
        EQ_BUNDLE_ID=${{ vars.EQ_BUNDLE_ID }}
        EQ_API_BASE_URL=${{ vars.EQ_API_BASE_URL }}
        CURRENT_PROJECT_VERSION=${{ github.run_number }}
        CODE_SIGN_STYLE=Automatic
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc/key.p8"
      - name: Archive
        run: |
          # -allowProvisioningUpdates 让 Xcode 用 API 密钥自动注册 App ID、App Group 并生成证书和描述文件
          xcodebuild archive \
            -project EQKeyboard.xcodeproj \
            -scheme EQKeyboard \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EQKeyboard.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            $BUILD_SETTINGS
      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ vars.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/EQKeyboard.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
